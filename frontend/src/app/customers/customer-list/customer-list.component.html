<div class="page">
  <div class="flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Khách hàng</h2>
    <button pButton label="+ Thêm khách hàng"></button>
  </div>
  <p-card>
    <p-table [value]="[]" [rows]="10" [loading]="true">
      <ng-template pTemplate="header">
        <tr>
          <th>Tên</th>
          <th>Điện thoại</th>
          <th>Công nợ</th>
          <th>Điểm</th>
          <th>Thao tác</th>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
