# Dùng cho VM phụ chỉ chạy API (sau load balancer).
#
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.node.yml up -d api
#
# Yêu cầu:
#   - deploy/.env giống VM chính (DB Supabase, Redis, RabbitMQ, JWT...)
#   - OCI Security List: mở port 8080 từ private IP của VM LB (VM1) sang VM này.
services:
  api:
    ports:
      - "${API_NODE_PORT:-8080}:8080"
