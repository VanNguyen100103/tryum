# VM2 override: chạy Caddy backup (entrypoint thứ 2) + api.
# Dùng: docker compose -f docker-compose.prod.yml -f docker-compose.node.yml -f docker-compose.vm2-caddy.yml up -d api caddy
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-tryum-api.duckdns.org}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.node:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
