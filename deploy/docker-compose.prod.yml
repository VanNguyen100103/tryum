# Production-like stack: Caddy (HTTPS) + API + PostgreSQL + web (SPA)
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Lưu ý production:
#   - Đặt file deploy/.env trên VM (KHÔNG commit).
#   - Database KHÔNG expose port ra ngoài; chỉ Caddy mở 80/443.

name: tryum

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tryum_db}
      POSTGRES_USER: ${POSTGRES_USER:-tryum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong .env}
      # Tăng tốc + giữ encoding UTF-8 (tiếng Việt trong tên sản phẩm)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tryum} -d ${POSTGRES_DB:-tryum_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GRAFANA_AUTH: ${GRAFANA_AUTH:-}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: ${API_IMAGE:-tryum-api:latest}
    # Oracle Ampere A1 = arm64; máy local có thể đặt TARGET_PLATFORM=linux/amd64 trong .env
    platform: ${TARGET_PLATFORM:-linux/arm64}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URL: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-tryum_db};Username=${POSTGRES_USER:-tryum};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-tryum-api}
      Jwt__Audience: ${JWT_AUDIENCE:-tryum-web}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?thiếu JWT_SECRET_KEY trong .env}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_IN_MINUTES:-60}
      Jwt__RefreshTokenExpiresInDays: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-https://localhost:7080}
      Cors__AllowedOrigins__1: ${WEB_ORIGIN_1:-}
      # Migration do CI/CD chạy lệnh `migrate`; bật true khi muốn API tự migrate lúc start.
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-false}
      # OTP demo (trả mã trong response) – production nên false, gửi SMS thật qua SMSGate.
      Auth__DemoOtpInResponse: ${DEMO_OTP_IN_RESPONSE:-false}
      # ── Captcha server-side (chống bot đốt quota SMS) ────────────────────────
      Captcha__Required: ${CAPTCHA_REQUIRED:-true}
      Captcha__TtlSeconds: ${CAPTCHA_TTL_SECONDS:-300}
      # ── OTP: chống spam + bảo vệ quota gateway ───────────────────────────────
      Otp__TtlSeconds: ${OTP_TTL_SECONDS:-300}
      Otp__CooldownSeconds: ${OTP_COOLDOWN_SECONDS:-30}
      Otp__MaxAttempts: ${OTP_MAX_ATTEMPTS:-5}
      # textbee free tier chỉ 50 tin/ngày => giữ thấp, mỗi SĐT tối đa 5 tin/24h.
      Otp__MaxSendsPerDay: ${OTP_MAX_SENDS_PER_DAY:-5}
      # ── SMS (self-host, MIỄN PHÍ – https://sms-gate.app) ────────────────
      Sms__Provider: ${SMS_PROVIDER:-SmsGate}
      Sms__SmsGate__SendUrl: ${SMS_GATE_URL:-https://api.sms-gate.app/3rdparty/v1/messages}
      Sms__SmsGate__Username: ${SMS_GATE_USERNAME:-}
      Sms__SmsGate__Password: ${SMS_GATE_PASSWORD:-}
      Sms__SmsGate__SimNumber: ${SMS_GATE_SIM:-1}
      # ── SMS: textbee.dev (https://textbee.dev) ──────────────────────────
      # Chỉ dùng khi SMS_PROVIDER=Textbee. API key chỉ hiện 1 lần trong dashboard.
      Sms__Textbee__ApiKey: ${TEXTBEE_API_KEY:-}
      Sms__Textbee__SendUrl: ${TEXTBEE_URL:-https://api.textbee.dev/api/v1/gateway/send-sms}
      Sms__Textbee__DeviceId: ${TEXTBEE_DEVICE_ID:-}
      Sms__Textbee__SimSubscriptionId: ${TEXTBEE_SIM:-}
      # ── Cloudflare R2: ảnh sản phẩm (bucket riêng tư, không đưa secret lên frontend) ──
      R2__AccountId: ${R2_ACCOUNT_ID:-}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      R2__BucketName: ${R2_BUCKET_NAME:-tryum}
      R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL:-}
      # ── SePay: webhook xác nhận chuyển khoản + VietQR (xem deploy/.env.example) ──
      SePay__WebhookSecret: ${SEPAY_WEBHOOK_SECRET:-}
      SePay__ApiKey: ${SEPAY_API_KEY:-}
      SePay__BankBin: ${SEPAY_BANK_BIN:-}
      SePay__BankName: ${SEPAY_BANK_NAME:-}
      SePay__AccountNumber: ${SEPAY_ACCOUNT_NUMBER:-}
      SePay__AccountName: ${SEPAY_ACCOUNT_NAME:-}
      SePay__VietQrTemplate: ${SEPAY_VIETQR_TEMPLATE:-compact2}
      SePay__PublicApiUrl: ${API_PUBLIC_URL:-https://localhost:7080}
      # ── Goship: bảng giá + tạo vận đơn cho Bán giao hàng ────────────────────
      Goship__BaseUrl: ${GOSHIP_BASE_URL:-https://sandbox.goship.io/api/v2}
      Goship__AccessToken: ${GOSHIP_ACCESS_TOKEN:-}
      Goship__ClientId: ${GOSHIP_CLIENT_ID:-}
      Goship__ClientSecret: ${GOSHIP_CLIENT_SECRET:-}
      # ── Chatbot AI: Groq chính, Gemini dự phòng ─────────────────────────────
      AI__GroqApiKey: ${GROQ_API_KEY:-}
      AI__GroqModel: ${GROQ_MODEL:-openai/gpt-oss-120b}
      AI__GeminiApiKey: ${GEMINI_API_KEY:-}
      AI__GeminiModel: ${GEMINI_MODEL:-gemini-3.6-flash}
      # ── Redis cache dùng chung Upstash (prefix tryum:) ───────────────────────
      Redis__Host: ${REDIS_HOST:-}
      Redis__Port: ${REDIS_PORT:-6379}
      Redis__Password: ${REDIS_PASSWORD:-}
      Redis__Ssl: ${REDIS_SSL:-true}
      Redis__Prefix: ${REDIS_PREFIX:-tryum:}
      # ── RabbitMQ / LavinMQ CloudAMQP ────────────────────────────────────────
      RabbitMq__Host: ${RABBITMQ_HOST:-}
      RabbitMq__Port: ${RABBITMQ_PORT:-5671}
      RabbitMq__Username: ${RABBITMQ_USER:-}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-}
      RabbitMq__VirtualHost: ${RABBITMQ_VHOST:-/}
      RabbitMq__Ssl: ${RABBITMQ_SSL:-true}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-tryum.events}
      # ── OpenTelemetry → Grafana Cloud ───────────────────────────────────────
      OpenTelemetry__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OpenTelemetry__Headers: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OpenTelemetry__ServiceName: ${OTEL_SERVICE_NAME:-tryum-api}
      OpenTelemetry__ServiceNamespace: ${OTEL_SERVICE_NAMESPACE:-tryum}
      OpenTelemetry__Environment: ${OTEL_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tryum-api}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=tryum,deployment.environment=production}
      Metrics__Token: ${METRICS_TOKEN:-}
    networks: [internal]
    # Không expose port: chỉ Caddy gọi nội bộ qua network "internal".

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: ${WEB_IMAGE:-tryum-web:latest}
    platform: ${TARGET_PLATFORM:-linux/arm64}
    restart: unless-stopped
    environment:
      API_URL: ${API_PUBLIC_URL:-https://localhost:7080}
    expose:
      - "80"
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    environment:
      # Tên miền phục vụ (bỏ port để Caddy bind 443 trong container).
      # Dry-run: localhost · Production: tryum-api.duckdns.org
      API_DOMAIN: ${API_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certs – nhớ backup
      - caddy_config:/config
    networks: [internal]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
