server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache file có hash trong tên (immutable)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.js luôn tải lại để đổi API_URL không cần rebuild
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # index.html không cache để deploy mới nhận ngay bundle mới
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: mọi route client-side đều trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}