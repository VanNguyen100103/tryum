# Staging THROWAWAY dùng cho DAST (ZAP / Nuclei) — KHÔNG phải production.
# DB + API tạm, tự migrate khi start, KHÔNG kết nối dịch vụ ngoài (Redis/RabbitMQ/R2
# đều để trống → các hosted service tự no-op).
#
#   docker compose -f deploy/docker-compose.dast.yml up -d
#   curl http://localhost:8080/health
#
name: tryum-dast

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tryum_dast
      POSTGRES_USER: tryum
      POSTGRES_PASSWORD: tryum_dast_pw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryum -d tryum_dast"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  api:
    image: ghcr.io/vannguyen100103/tryum-api:otel
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URL: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=tryum_dast;Username=tryum;Password=tryum_dast_pw
      # Tự migrate + seed khi start (DB throwaway nên an toàn).
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Issuer: tryum-dast
      Jwt__Audience: tryum-web
      # Key 32 byte base64 — chỉ cho DAST staging, không phải secret thật.
      Jwt__SecretKey: ZGV2LW9ubHkta2V5LW5vdC1mb3ItcHJvZC0xMjM0NTY=
      # Để ZAP có thể crawl đăng ký/đăng nhập mà không cần OTP/Captcha thật.
      Auth__DemoOtpInResponse: "true"
      Captcha__Required: "false"
      Cors__AllowedOrigins__0: http://localhost:8080
    ports:
      - "8080:8080"
