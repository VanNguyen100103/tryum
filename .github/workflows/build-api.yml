name: build-api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/otel-collector.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.auto
          platforms: linux/amd64
          push: true
          tags: ghcr.io/vannguyen100103/tryum-api:otel
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy VM1 (api + api2 + caddy)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/tryum
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/vannguyen100103/tryum-api:otel
            docker tag tryum-api:latest tryum-api:previous 2>/dev/null || true
            docker tag ghcr.io/vannguyen100103/tryum-api:otel tryum-api:latest
            docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.vm1.yml --env-file deploy/.env up -d --force-recreate api api2
            docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.vm1.yml --env-file deploy/.env up -d --no-deps --force-recreate caddy

            # Chờ cả 2 API healthy (check qua mạng nội bộ từ container caddy).
            ok=0
            for i in $(seq 1 25); do
              if docker exec tryum-caddy-1 wget -qO- -T 5 http://api:8080/health >/dev/null 2>&1 && \
                 docker exec tryum-caddy-1 wget -qO- -T 5 http://api2:8080/health >/dev/null 2>&1; then
                ok=1; break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "VM1 health FAIL -> rollback"
              docker tag tryum-api:previous tryum-api:latest
              docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.vm1.yml --env-file deploy/.env up -d --force-recreate api api2
              docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.vm1.yml --env-file deploy/.env up -d --no-deps --force-recreate caddy
              exit 1
            fi
            echo "VM1 deployed OK"

      - name: Deploy VM2 (api)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM2_HOST }}
          username: ubuntu
          key: ${{ secrets.VM2_SSH_KEY }}
          script_stop: true
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/tryum
            echo "$GHCR_TOKEN" | sudo -n /usr/bin/docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo -n /usr/bin/docker pull ghcr.io/vannguyen100103/tryum-api:otel
            sudo -n /usr/bin/docker tag tryum-api:latest tryum-api:previous 2>/dev/null || true
            sudo -n /usr/bin/docker tag ghcr.io/vannguyen100103/tryum-api:otel tryum-api:latest
            sudo -n /usr/bin/docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.node.yml --env-file deploy/.env up -d --force-recreate api

            ok=0
            for i in $(seq 1 25); do
              if curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:8080/health | grep -q 200; then
                ok=1; break
              fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "VM2 health FAIL -> rollback"
              sudo -n /usr/bin/docker tag tryum-api:previous tryum-api:latest
              sudo -n /usr/bin/docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.node.yml --env-file deploy/.env up -d --force-recreate api
              exit 1
            fi
            echo "VM2 deployed OK"
