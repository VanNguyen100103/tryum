name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build & test the .NET 10 backend
  # ─────────────────────────────────────────────
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore backend/Tryum.slnx

      - name: Build (Release)
        run: dotnet build backend/Tryum.slnx --no-restore --configuration Release

      - name: Run tests + coverage
        run: >-
          dotnet test backend/Tryum.slnx
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory backend/tests/TestResults

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: backend/tests/TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check formatting
        run: dotnet format backend/Tryum.slnx --verify-no-changes --verbosity minimal

  # ─────────────────────────────────────────────
  # Job 2: Build & test the Angular 22 frontend
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Angular 22 / Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watch=false
