name: ai-dev

on:
  schedule:
    # 04:00 giờ Việt Nam = 21:00 UTC
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ai-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore backend/Tryum.slnx

      # Sinh test bằng AI + gate build/test. Fail -> đưa lỗi lại cho AI tự sửa (tối đa 3 lần).
      - name: AI generate + gate (self-correct, 3 attempts)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          PASS=0
          FEEDBACK=""
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            if ! AI_FEEDBACK="$FEEDBACK" python3 deploy/ai_agent.py; then
              echo "agent không sinh được file ở lần $attempt"
              continue
            fi

            if dotnet build backend/Tryum.slnx --no-restore --configuration Release > /tmp/build.log 2>&1 \
               && dotnet test backend/Tryum.slnx --no-build --configuration Release > /tmp/test.log 2>&1; then
              echo "Gate PASS ở lần $attempt"
              PASS=1
              break
            fi

            echo "Gate FAIL ở lần $attempt"
            grep -E "Failed |Error Message|Assert" /tmp/test.log | head -20
            FEEDBACK=$(grep -A2 "Error Message" /tmp/test.log | head -30)
            rm -rf backend/tests/Tryum.UnitTests/AiGenerated
          done

          if [ "$PASS" = "1" ]; then
            echo "GATE=pass" >> "$GITHUB_ENV"
          else
            echo "GATE=fail" >> "$GITHUB_ENV"
          fi

      - name: Commit + dispatch deploy
        if: env.GATE == 'pass'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/tests/Tryum.UnitTests/AiGenerated
          if git diff --cached --quiet; then
            echo "Không có file mới."
          else
            git commit -m "test: AI-generated unit tests (nightly)"
            git push
            gh workflow run build-api.yml --ref main
            gh workflow run deploy-web.yml --ref main
          fi

      - name: Báo Telegram (kết quả)
        if: always()
        run: |
          if [ "$GATE" = "pass" ]; then
            TEXT="ai-dev: AI sinh test PASS -> da commit + deploy."
          else
            TEXT="ai-dev: AI sinh test KHONG pass sau 3 lan -> da xoa, khong commit (run ${{ github.run_id }})."
          fi
          curl -s -m 15 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$TEXT" > /dev/null || true
