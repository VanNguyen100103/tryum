name: auto-maintain

on:
  schedule:
    # 03:00 giờ Việt Nam = 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore (.NET)
        run: dotnet restore backend/Tryum.slnx

      - name: Format backend (.NET)
        run: dotnet format backend/Tryum.slnx --verbosity minimal

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Format frontend (Prettier)
        working-directory: frontend
        run: npx prettier --write "src/**/*.{ts,html,scss}"

      # ── Cổng kiểm tra: chỉ commit nếu tất cả build + test pass ──
      - name: Gate — build backend
        run: dotnet build backend/Tryum.slnx --no-restore --configuration Release

      - name: Gate — test backend
        run: dotnet test backend/Tryum.slnx --no-build --configuration Release

      - name: Gate — build frontend
        working-directory: frontend
        run: npm run build

      # ── Commit + đẩy → dispatch deploy ──
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CHANGES=1" >> "$GITHUB_ENV"
            echo "Không có thay đổi format."
          else
            git commit -m "chore: auto-format + maintain (nightly)"
            git push
            echo "NO_CHANGES=0" >> "$GITHUB_ENV"
          fi

      - name: Dispatch build + deploy
        if: env.NO_CHANGES == '0'
        run: |
          gh workflow run build-api.yml --ref main
          gh workflow run deploy-web.yml --ref main

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -m 15 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 auto-maintain FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null || true
